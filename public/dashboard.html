<script>
const $=s=>document.querySelector(s),E=['nuevo','confirmado','empaque','enviado','entregado'],EL={nuevo:'Nuevo',confirmado:'Confirmado',empaque:'En empaque',enviado:'Enviado',entregado:'Entregado'};
const LS={g(k,d){try{return localStorage.getItem('todoenuno_'+k)||d}catch(e){return d}},s(k,v){try{localStorage.setItem('todoenuno_'+k,v)}catch(e){}}};
let S={tab:'resumen',mode:LS.g('mode','demo'),orders:[],chats:[],prods:[],cm:[],sel:0,q:'',f:'all',pf:'all',auto:true,rules:(LS.g('rules','barato,http,estafa,spam')).split(','),ep:{}};

const live=()=>S.mode==='live'&&cfg().url&&cfg().key,$m=n=>'$'+Number(n||0).toFixed(2).replace(/\.00$/,''),h=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2800)}
async function sb(p,o={}){const c=cfg(),r=await fetch(c.url.replace(/\/+$/,'')+'/rest/v1/'+p,{...o,headers:{apikey:c.key,Authorization:'Bearer '+c.key,'Content-Type':'application/json',...(o.headers||{})}});if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,70));return r.status==204?null:r.json()}
const patch=(t,q,b)=>sb(t+'?'+q,{method:'PATCH',body:JSON.stringify(b),headers:{Prefer:'return=minimal'}});
function demo(){const N=['Esau Martínez','Karla Méndez','José Alfaro','Elena Rivas','Marvin Torres','Gabriela Ortiz','Luis Morales','Andrea Campos'],P=[['Carritos de mercado',20],['Bocina X-312 Portable',12],['Capibara de Peluche',15],['Combo pulsera magnética',15],['Calzado Confort Verano',12],['Pistola de Burbujas',10]];
S.orders=N.map((n,i)=>{const p=P[i%6],q=1+i%2;return{id:'P'+(101+i),nombre:n,tel:'5037'+(100+i*37)+(2000+i*313),dir:['Col. Escalón','Soyapango','Santa Tecla','Mejicanos'][i%4]+', San Salvador',items:[{nombre:p[0],qty:q,precio:p[1]}],total:p[1]*q,estado:E[i%5],pago:i%2?'transferencia':'efectivo'}});
S.chats=N.map((n,i)=>({tel:'503700'+(1000+i),nombre:n,paso:i==1||i==4?'asesor':i==2?'confirmado':null,msgs:[['c','Hola, ¿qué tienen?'],['b','¡Hola! Soy Todd de TodoEnUno SV 💛 Tenemos 68 productos con envío gratis 🚚'],['c',['Quiero más info de los carritos','¿Hacen envíos a Santa Ana?','Lo quiero','Quiero hablar con un asesor'][i%4]]]}));
S.prods=[...P,...P].map((p,i)=>({sku:'TO-'+(100+i),nombre:p[0]+(i>5?' (talla M)':''),precio:p[1],st:i%7==6?'NO_DISPONIBLE':i%3?'DISPONIBLE':'TEST',qty:i%3?[12,5,30,8][i%4]:0}));S.cm=[]}
async function load(){if(!live()){demo();return}
try{const[o,cv,st,pv,iv]=await Promise.all([sb('whatsapp_orders?select=*&limit=300'),sb('whatsapp_conversations?select=*&order=created_at.desc&limit=500'),sb('whatsapp_state?select=*'),sb('productos_variantes?select=*&limit=1000'),sb('inventory_cache?select=*&limit=1000')]);
S.orders=o.map(x=>({id:x.id,nombre:x.nombre,tel:x.telefono_cliente||x.telefono,dir:x.direccion,items:x.items||[],total:+x.total||0,estado:E.includes(x.estado)?x.estado:'nuevo',pago:x.metodo_pago}));
const sm={};st.forEach(x=>sm[x.telefono]=x),cm={};cv.reverse().forEach(r=>{(cm[r.telefono]=cm[r.telefono]||[]).push(['c',r.entrada],['b',r.respuesta])});
S.chats=Object.keys(cm).map(t=>({tel:t,nombre:(sm[t]&&sm[t].nombre_cliente)||t,paso:sm[t]&&sm[t].paso,msgs:cm[t]}));
const im={};iv.forEach(i=>im[i.sku]=i);S.prods=pv.map(v=>{const i=im[v.sku]||{};return{sku:v.sku,nombre:v.nombre_completo||v.nombre,precio:+v.precio||0,st:String(i.state||v.estado||'DISPONIBLE').toUpperCase(),qty:+(i.qty??v.stock)||0}});S.cm=[]}
catch(e){toast('Live falló: '+e.message+' · usando demo');demo()}}
async function adv(id,d){const o=S.orders.find(x=>x.id==id),i=E.indexOf(o.estado)+d;if(i<0||i>4)return;o.estado=E[i];render();
if(live())try{await patch('whatsapp_orders','id=eq.'+id,{estado:o.estado})}catch(e){toast('No se guardó: '+e.message)}else toast('Demo: '+o.nombre+' → '+EL[o.estado])}
async function setP(t,v){const c=S.chats.find(x=>x.tel==t);c.paso=v;render();if(live())try{await patch('whatsapp_state','telefono=eq.'+t,{paso:v})}catch(e){toast('Error: '+e.message)}else toast(v?'Chat tomado (demo)':'Devuelto al bot (demo)')}
async function send(t,x){if(!x)return;const c=S.chats.find(y=>y.tel==t);c.msgs.push(['h',x]);if(c.paso!=='asesor')c.paso='asesor';render();
if(live()&&cfg().evo)try{const k=cfg(),r=await fetch(k.evo.replace(/\/+$/,'')+'/message/sendText/'+k.inst,{method:'POST',headers:{'Content-Type':'application/json',apikey:k.ek},body:JSON.stringify({number:t,text:x})});if(!r.ok)throw new Error(r.status)}catch(e){toast('Evolution falló: '+e.message)}else toast('Enviado (demo)')}
async function mk(t){const c=S.chats.find(x=>x.tel==t),p=S.prods.find(x=>x.sku==$('#ps').value),q=+$('#pq2').value||1,d=$('#pd').value.trim();if(!p||!d){toast('Elegí producto y dirección');return}
const o={id:'P'+(200+S.orders.length),nombre:c.nombre,tel:t,dir:d,items:[{nombre:p.nombre,qty:q,precio:p.precio}],total:p.precio*q,estado:'nuevo',pago:'efectivo'};
if(live())try{await sb('whatsapp_orders',{method:'POST',body:JSON.stringify({telefono:t,nombre:c.nombre,telefono_cliente:t,direccion:d,items:o.items,total:o.total,estado:'nuevo',metodo_pago:'efectivo'}),headers:{Prefer:'return=minimal'}})}catch(e){toast('Error: '+e.message);return}
S.orders.unshift(o);S.tab='pedidos';render();toast('Pedido creado · '+$m(o.total))}
const EP=()=>{const c=cfg();return[{n:'Webhook WhatsApp',u:c.web&&c.web.replace(/\/+$/,'')+'/api/evolution/webhook?debug=1'},{n:'Evolution API',u:c.evo&&c.evo.replace(/\/+$/,'')+'/instance/connectionState/'+c.inst,hd:{apikey:c.ek}},{n:'Supabase REST',u:c.url&&c.url.replace(/\/+$/,'')+'/rest/v1/',hd:{apikey:c.key}},{n:'Sync Odoo → Supabase',u:c.sync}]};
async function ping(i){const e=EP()[i],t=performance.now();let s;if(S.mode!=='live'){await new Promise(r=>setTimeout(r,150+Math.random()*350));s=Math.random()>.1?200:503}else if(!e.u)s=-1;else try{s=(await fetch(e.u,{headers:e.hd||{}})).status}catch(x){s=0}S.ep[i]={s,ms:Math.round(performance.now()-t)};render()}
const pingAll=()=>EP().forEach((_,i)=>ping(i));
const pill=s=>`<span class="pill ${s>=200&&s<300?'ok':s==-1?'':'er'}">${s==-1?'sin configurar':s==0?'sin respuesta':s}</span>`;
const T={
resumen(){const o=S.orders,tot=o.reduce((a,x)=>a+x.total,0),hu=S.chats.filter(c=>c.paso==='asesor'),cn=E.map(e=>o.filter(x=>x.estado===e).length),mx=Math.max(1,...cn);
return`<h1>Resumen</h1><p class="sub">Operación en vivo · ${live()?'datos reales de Supabase':'modo demo con datos de ejemplo'}</p><div class="kp">${[['Ventas',$m(tot),'ok'],['Pedidos',o.length,''],['Ticket promedio',$m(o.length?tot/o.length:0),''],['Esperan asesor',hu.length,hu.length?'er':''],['Productos activos',S.prods.filter(p=>p.st!=='NO_DISPONIBLE').length,'']].map(k=>`<div class="cd"><small>${k[0]}</small><b class="${k[2]}">${k[1]}</b></div>`).join('')}</div>
<div class="g2"><div class="cd"><h3>Embudo de pedidos</h3><svg viewBox="0 0 300 130" width="100%">${cn.map((n,i)=>{const hh=n/mx*70;return`<rect x="${i*58+10}" y="${100-hh}" width="40" height="${hh}" rx="6" fill="var(--ac)"/><text x="${i*58+30}" y="${94-hh}" text-anchor="middle" fill="var(--tx)" font-size="11">${n}</text><text x="${i*58+30}" y="118" text-anchor="middle" fill="var(--mu)" font-size="8.5">${EL[E[i]]}</text>`}).join('')}</svg></div>
<div class="cd"><h3>Atención ahora</h3>${hu.length?hu.map(c=>`<div class="row" style="justify-content:space-between;margin-bottom:6px"><span>${h(c.nombre)}</span><button class="b" data-a="chat" data-t="${c.tel}">Atender</button></div>`).join(''):'<p class="sub">Nadie espera a un asesor ✅</p>'}<p class="sub">${cn[0]} pedidos nuevos sin confirmar · <a href="#" data-a="tab" data-t="pedidos" style="color:var(--tx)">ver tablero</a></p></div>
<div class="cd"><h3>Salud de sistemas</h3>${EP().map((e,i)=>{const p=S.ep[i];return`<div class="row" style="justify-content:space-between"><span><span class="dot ${p?(p.s>=200&&p.s<300?'ok':'er'):''}"></span>${e.n}</span><small>${p?p.ms+' ms':'sin probar'}</small></div>`}).join('')}<button class="g" data-a="pa" style="margin-top:8px">Probar todo</button></div></div>`},
pedidos(){const q=S.q.toLowerCase(),L=S.orders.filter(o=>!q||(o.nombre+o.dir+o.id).toLowerCase().includes(q));
return`<h1>Pedidos</h1><p class="sub">Un clic mueve la fase y se guarda en <code>whatsapp_orders.estado</code>.</p><div class="row" style="margin-bottom:10px"><input id="q" data-a="q" placeholder="Buscar cliente, zona o ID" value="${h(S.q)}"><span class="pill">${L.length} pedidos · ${$m(L.reduce((a,x)=>a+x.total,0))}</span></div>
<div class="kb">${E.map((e,ci)=>{const l=L.filter(o=>o.estado===e);return`<div class="col"><h3>${EL[e]} <span class="pill">${l.length}</span></h3>${l.map(o=>`<div class="cd oc"><b>${h(o.nombre)}</b> <small>${h(o.id)}</small><p>${o.items.map(i=>h(i.nombre)+' ×'+(i.qty||1)).join(', ')}</p><p>📍 ${h(o.dir)}</p><div class="row" style="justify-content:space-between"><b>${$m(o.total)}</b><span class="pill">${h(o.pago||'—')}</span></div><div class="row" style="margin-top:6px"><button class="g" data-a="adv" data-t="${o.id}" data-d="-1">←</button><button class="b" data-a="adv" data-t="${o.id}" data-d="1" ${ci==4?'disabled':''}>${ci==4?'Listo':'Avanzar →'}</button><a class="pill" target="_blank" rel="noopener" href="https://wa.me/${String(o.tel).replace(/\D/g,'')}">WhatsApp</a></div></div>`).join('')||'<p class="sub">Vacío</p>'}</div>`}).join('')}</div>`},
chats(){const L=S.chats.filter(c=>S.f==='all'||(S.f==='h'?c.paso==='asesor':c.paso!=='asesor')),c=S.chats.find(x=>x.tel==S.sel)||L[0];
return`<h1>Chats y handoff</h1><p class="sub">Tomá un chat cuando el cliente pida asesor; el bot se pausa hasta que lo devuelvas.</p><div class="row" style="margin-bottom:8px">${[['all','Todos'],['h','Humano'],['b','Bot']].map(f=>`<button class="${S.f==f[0]?'b':'g'}" data-a="f" data-t="${f[0]}">${f[1]}</button>`).join('')}</div>
